<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動列表 | Smart Campus System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
  .page-shell { display: flex; flex-direction: column; gap: 20px; }
  .hero-card {
    background: linear-gradient(135deg, #102542 0%, #1f4a7c 55%, #f59e0b 140%);
    border-radius: 20px;
    color: #fff;
    padding: 28px;
    position: relative;
    overflow: hidden;
  }
  .hero-card::after {
    content: "";
    position: absolute;
    right: -80px;
    top: -80px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
  }
  .hero-eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
  .hero-title { font-size: 28px; font-weight: 700; margin-top: 10px; }
  .hero-copy { max-width: 720px; margin-top: 10px; line-height: 1.7; color: rgba(255, 255, 255, 0.86); }

  .filter-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
  }
  .filter-field { display: flex; flex-direction: column; gap: 6px; }
  .filter-field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .filter-field input,
  .filter-field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--font);
    font-size: 13px;
    background: #fff;
  }
  .filter-field input:focus,
  .filter-field select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .filter-actions {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }

  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .results-title { font-size: 18px; font-weight: 700; }
  .results-meta { color: var(--text-muted); font-size: 13px; }

  /* ── 表格樣式 ── */
  .event-list {
    display: flex;
    flex-direction: column;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    background: var(--card-bg);
  }
  .event-table-header {
    display: grid;
    grid-template-columns: 140px 200px 160px 100px 120px 140px;
    gap: 0;
    padding: 14px 16px;
    background: #f8fafc;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .event-row {
    display: grid;
    grid-template-columns: 140px 200px 160px 100px 120px 140px;
    gap: 0;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background-color 0.16s ease, border-color 0.16s ease;
  }
  .event-row:last-child { border-bottom: none; }
  .event-row:hover {
    background-color: #f0f4f9;
    border-bottom-color: var(--accent);
  }

  .event-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-col-time {
    font-size: 12px;
    color: #475569;
  }
  .event-col-time-main {
    font-size: 14px;
    font-weight: 700;
    color: #102542;
    margin-top: 2px;
  }
  .event-col-title {
    font-size: 14px;
    font-weight: 600;
    color: #102542;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-col-organizer {
    font-size: 13px;
    color: #475569;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-col-service {
    font-size: 13px;
    color: #3f6212;
    background: #ecfccb;
    border: 1px solid #d4e890;
    border-radius: 8px;
    padding: 6px 10px;
    text-align: center;
    white-space: nowrap;
  }
  .event-col-status {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.open { background: #22c55e; }
  .status-dot.waitlist { background: #f59e0b; }
  .status-dot.full { background: #ef4444; }
  .status-dot.registered { background: #3b82f6; }
  .event-col-action {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .event-col-action button {
    padding: 6px 12px;
    font-size: 12px;
    white-space: nowrap;
  }

  /* ── Modal 樣式 (已移除) ── */
  .empty-state, .loading-state, .error-state {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 24px;
    text-align: center;
  }
  .empty-state h3, .error-state h3 { font-size: 18px; margin-bottom: 8px; }
  .empty-state p, .loading-state p, .error-state p { color: var(--text-muted); line-height: 1.7; }

  @media (max-width: 1100px) {
    .filter-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .event-table-header { grid-template-columns: 120px 180px 140px 90px 100px 120px; }
    .event-row { grid-template-columns: 120px 180px 140px 90px 100px 120px; }
  }

  @media (max-width: 760px) {
    .main { margin-left: 0; }
    .content { padding: 18px; }
    .hero-title { font-size: 24px; }
    .filter-panel { grid-template-columns: 1fr; }
    .results-header { flex-direction: column; align-items: flex-start; }
    
    .event-table-header { display: none; }
    .event-row {
      grid-template-columns: 1fr;
      padding: 12px;
      gap: 8px;
    }
    .event-col {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 8px;
    }
    .event-col::before {
      content: attr(data-label);
      font-weight: 600;
      color: var(--text-muted);
      min-width: 60px;
      font-size: 12px;
    }
    .event-col-action {
      justify-content: flex-start !important;
    }
    .modal-content {
      max-height: 95vh;
    }
  }
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar"></aside>
<div class="main">
  <header class="topbar">
    <button class="topbar-toggle" id="sidebar-toggle" aria-label="收合選單">
      ☰
    </button>
    <div class="topbar-title"></div>
    <div class="api-status">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">连接中</span>
    </div>
  </header>
  <div class="content">
    <div class="page-shell">
      <section class="hero-card">
        <div class="hero-eyebrow">Events Hub</div>
        <div class="hero-title">活動報名與服務時數</div>
        <p class="hero-copy">
          集中查看校內活動、課程型講座與服務學習項目。你可以依主辦單位、時數類別與報名狀態篩選，並直接展開查看詳細資訊。
        </p>
      </section>

      <section class="filter-panel">
        <div class="filter-field">
          <label for="search-input">關鍵字</label>
          <input id="search-input" type="text" placeholder="搜尋活動名稱、主辦單位、地點">
        </div>
        <div class="filter-field">
          <label for="organizer-filter">主辦單位</label>
          <select id="organizer-filter">
            <option value="">全部單位</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="service-type-filter">時數類別</label>
          <select id="service-type-filter">
            <option value="">全部類別</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="status-filter">報名狀態</label>
          <select id="status-filter">
            <option value="">全部狀態</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="sort-filter">排序方式</label>
          <select id="sort-filter">
            <option value="start_at:asc">活動時間：早到晚</option>
            <option value="start_at:desc">活動時間：晚到早</option>
            <option value="created_at:desc">建立時間：新到舊</option>
            <option value="registered:desc">報名人數：多到少</option>
          </select>
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary" id="apply-button" type="button">套用條件</button>
          <button class="btn btn-ghost" id="reset-button" type="button">重設</button>
        </div>
      </section>

      <section class="results-header">
        <div>
          <div class="results-title">活動列表</div>
          <div class="results-meta" id="results-meta">尚未载入资料</div>
        </div>
      </section>

      <div id="loading-state" class="loading-state">
        <p>正在載入活動資料...</p>
      </div>
      <div id="error-state" class="error-state" style="display:none;">
        <h3>活動資料載入失敗</h3>
        <p id="error-text"></p>
      </div>
      <div id="empty-state" class="empty-state" style="display:none;">
        <h3>沒有符合條件的活動</h3>
        <p>調整篩選條件後再試一次。</p>
      </div>
      <div id="events-list" style="display:none;">
        <div class="event-table-header">
          <div>活動時間</div>
          <div>活動名稱</div>
          <div>主辦單位</div>
          <div>時數</div>
          <div>報名狀態</div>
          <div>操作</div>
        </div>
        <div id="events-rows" class="event-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/events-browse.js"></script>
</body>
</html>
