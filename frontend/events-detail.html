<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動詳細 | Smart Campus System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
  .detail-shell {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  
  .detail-hero {
    background: linear-gradient(135deg, #102542 0%, #1f4a7c 55%, #f59e0b 140%);
    border-radius: 20px;
    color: #fff;
    padding: 36px;
    position: relative;
    overflow: hidden;
  }
  .detail-hero::after {
    content: "";
    position: absolute;
    right: -80px;
    top: -80px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
  }
  .hero-breadcrumb {
    font-size: 12px;
    letter-spacing: 0.05em;
    opacity: 0.75;
    margin-bottom: 8px;
  }
  .hero-breadcrumb a {
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    transition: color 0.16s ease;
  }
  .hero-breadcrumb a:hover {
    color: #fff;
  }
  .hero-title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 12px;
    line-height: 1.3;
  }
  .hero-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .hero-meta-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    opacity: 0.85;
  }

  .detail-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .detail-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .detail-section-title {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }
  .detail-section-divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 12px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .info-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .info-value {
    font-size: 16px;
    color: #102542;
    font-weight: 600;
    line-height: 1.5;
  }

  .description-box {
    background: #f8fafc;
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 18px;
    line-height: 1.8;
    color: #334155;
  }

  .capacity-box {
    background: #fffbeb;
    border: 1px solid #fcd34d;
    border-radius: 12px;
    padding: 18px;
  }
  .capacity-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #92400e;
  }
  .capacity-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }
  .capacity-row:last-child {
    margin-bottom: 0;
  }
  .capacity-stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .capacity-stat-label {
    font-size: 12px;
    color: #92400e;
  }
  .capacity-stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #7c2d12;
  }

  .progress-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #334155;
  }
  .progress-bar {
    height: 12px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  .action-section {
    display: flex;
    gap: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .action-section .btn {
    flex: 1;
    min-height: 44px;
  }

  .tags-section {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    display: inline-flex;
    padding: 6px 12px;
    border-radius: 999px;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    font-size: 12px;
    color: #475569;
  }

  .loading-state {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 60px 24px;
    text-align: center;
  }
  .error-state {
    background: #fee2e2;
    border: 1px solid #fecaca;
    border-radius: 16px;
    padding: 24px;
  }
  .error-state h3 {
    color: #991b1b;
    margin-bottom: 8px;
  }
  .error-state p {
    color: #7f1d1d;
  }

  @media (max-width: 900px) {
    .detail-hero {
      padding: 28px;
    }
    .detail-hero::after {
      right: -60px;
      top: -60px;
      width: 160px;
      height: 160px;
    }
    .info-grid {
      grid-template-columns: 1fr;
    }
    .capacity-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 760px) {
    .main { margin-left: 0; }
    .content { padding: 16px; }
    .detail-shell { gap: 16px; }
    .detail-card { padding: 20px; }
    .detail-hero {
      padding: 24px;
      margin-bottom: 8px;
    }
    .hero-title {
      font-size: 24px;
    }
    .hero-meta {
      gap: 12px;
      margin-top: 12px;
    }
    .action-section {
      flex-direction: column;
    }
  }
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar"></aside>
<div class="main">
  <header class="topbar">
    <button class="topbar-toggle" id="sidebar-toggle" aria-label="收合選單">
      ☰
    </button>
    <div class="topbar-title"></div>
    <div class="api-status">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">連接中</span>
    </div>
  </header>
  <div class="content">
    <div class="detail-shell">
      <div id="loading-state" class="loading-state">
        <p>正在載入活動詳細資訊...</p>
      </div>
      
      <div id="error-state" class="error-state" style="display:none;">
        <h3>載入失敗</h3>
        <p id="error-text"></p>
        <p style="margin-top: 12px;"><a href="events.html" class="btn btn-ghost" style="display: inline-block;">返回活動列表</a></p>
      </div>

      <div id="detail-content" style="display:none;">
        <div class="detail-hero">
          <div class="hero-breadcrumb">
            <a href="events.html">活動列表</a> / 活動詳細
          </div>
          <h1 class="hero-title" id="detail-title"></h1>
          <div class="hero-meta">
            <div class="hero-meta-item">
              <span id="detail-organizer-meta"></span>
            </div>
            <div class="hero-meta-item">
              <span id="detail-time-meta"></span>
            </div>
            <div class="hero-meta-item">
              <span id="detail-service-meta"></span>
            </div>
          </div>
        </div>

        <div class="detail-card">
          <!-- 基本信息 -->
          <div class="detail-section">
            <div class="detail-section-title">基本資訊</div>
            <div class="detail-section-divider"></div>
            <div class="info-grid">
              <div class="info-item">
                <div class="info-label">活動時間</div>
                <div class="info-value" id="detail-datetime"></div>
              </div>
              <div class="info-item">
                <div class="info-label">主辦單位</div>
                <div class="info-value" id="detail-organizer"></div>
              </div>
              <div class="info-item">
                <div class="info-label">活動地點</div>
                <div class="info-value" id="detail-location"></div>
              </div>
              <div class="info-item">
                <div class="info-label">提供時數</div>
                <div class="info-value" id="detail-service"></div>
              </div>
            </div>
          </div>

          <!-- 活動說明 -->
          <div class="detail-section">
            <div class="detail-section-title">活動概要</div>
            <div class="detail-section-divider"></div>
            <div class="description-box" id="detail-summary"></div>
          </div>

          <!-- 詳細說明 -->
          <div class="detail-section">
            <div class="detail-section-title">活動詳細說明</div>
            <div class="detail-section-divider"></div>
            <div class="description-box" id="detail-description"></div>
          </div>

          <!-- 報名信息 -->
          <div class="detail-section">
            <div class="detail-section-title">報名資訊</div>
            <div class="detail-section-divider"></div>
            <div class="capacity-box">
              <div class="capacity-title">報名狀況</div>
              <div class="capacity-row">
                <div class="capacity-stat">
                  <div class="capacity-stat-label">現已報名</div>
                  <div class="capacity-stat-value" id="detail-registered">0</div>
                </div>
                <div class="capacity-stat">
                  <div class="capacity-stat-label">人數限制</div>
                  <div class="capacity-stat-value" id="detail-max">無限制</div>
                </div>
                <div class="capacity-stat">
                  <div class="capacity-stat-label">可報名名額</div>
                  <div class="capacity-stat-value" id="detail-available">-</div>
                </div>
              </div>
              <div id="detail-progress-container" style="display:none;">
                <div class="progress-container">
                  <div class="progress-label">
                    <span>報名進度</span>
                    <span id="detail-progress-text">0/0</span>
                  </div>
                  <div class="progress-bar">
                    <div class="progress-fill" id="detail-progress-fill" style="width: 0%"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 標籤 -->
          <div class="detail-section" id="tags-section" style="display:none;">
            <div class="detail-section-title">標籤</div>
            <div class="detail-section-divider"></div>
            <div class="tags-section" id="detail-tags"></div>
          </div>

          <!-- 操作按鈕 -->
          <div class="action-section">
            <button class="btn btn-ghost" onclick="window.history.back()">返回</button>
            <button class="btn btn-primary" id="detail-register-btn" onclick="registerFromDetail()">立即報名</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/events-detail.js"></script>
</body>
</html>
