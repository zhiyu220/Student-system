<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動報名 | Smart Campus System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
  .register-shell { max-width: 860px; margin: 0 auto; }
  .register-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  .register-hero {
    padding: 28px 30px;
    background: linear-gradient(135deg, #102542 0%, #24507e 52%, #f59e0b 145%);
    color: #fff;
  }
  .register-hero h2 { font-size: 28px; margin-bottom: 8px; }
  .register-hero p { color: rgba(255,255,255,0.82); line-height: 1.7; }
  .register-body { padding: 28px 30px 30px; }
  .event-panel {
    border: 1px solid #dbe4ff;
    background: linear-gradient(180deg, #f8fbff, #f9fafb);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .event-panel h3 { font-size: 22px; margin-bottom: 10px; color: #102542; }
  .event-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .event-meta-item { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .event-meta-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .event-meta-value { font-size: 14px; color: var(--text); line-height: 1.6; }
  .event-badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
  .event-badge { display: inline-flex; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-category { background: #e0f2fe; color: #075985; }
  .badge-service { background: #ecfccb; color: #3f6212; }
  .badge-status { background: #dbeafe; color: #1d4ed8; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { margin-bottom: 20px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .form-input, .form-textarea, .form-select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: var(--font);
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .form-textarea { resize: vertical; min-height: 100px; }
  .section-block {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 20px;
    background: #fff;
  }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .section-copy { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.7; }
  .checkbox-row { display: flex; gap: 10px; align-items: flex-start; }
  .checkbox-row input { margin-top: 3px; }
  .notice { border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; display: none; }
  .notice.success { background: #dcfce7; border: 1px solid #86efac; color: #166534; }
  .notice.error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
  .loading { color: var(--text-muted); margin-bottom: 18px; display: none; }
  .actions { display: flex; gap: 12px; margin-top: 28px; }
  .actions .btn { flex: 1; }
  .empty-custom-fields {
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 14px;
    color: var(--text-muted);
    font-size: 13px;
    background: #fafaf8;
  }
  @media (max-width: 760px) {
    .main { margin-left: 0; }
    .content { padding: 18px; }
    .register-hero, .register-body { padding: 22px 18px; }
    .event-meta, .form-grid { grid-template-columns: 1fr; }
    .actions { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar"></aside>
<div class="main">
  <header class="topbar">
    <button class="topbar-toggle" id="sidebar-toggle" aria-label="收合選單">
      ☰
    </button>
    <div class="topbar-title"></div>
    <div class="api-status">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">連線中</span>
    </div>
  </header>
  <div class="content">
    <div class="register-shell">
      <section class="register-card">
        <div class="register-hero">
          <h2>活動報名</h2>
          <p>請確認活動資訊與報名資料。表單會包含基本身份欄位，若主辦單位有設定額外需求，也會在下方顯示特殊欄位。</p>
        </div>
        <div class="register-body">
          <div id="error-message" class="notice error"></div>
          <div id="success-message" class="notice success"></div>
          <div id="loading-indicator" class="loading">正在送出報名資料...</div>

          <div class="event-panel">
            <h3 id="event-title">載入中</h3>
            <div class="event-badges">
              <span class="event-badge badge-category" id="event-category">活動類別</span>
              <span class="event-badge badge-service" id="event-service">時數資訊</span>
              <span class="event-badge badge-status" id="event-status">報名狀態</span>
            </div>
            <div class="event-meta">
              <div class="event-meta-item">
                <div class="event-meta-label">活動時間</div>
                <div class="event-meta-value" id="event-time"></div>
              </div>
              <div class="event-meta-item">
                <div class="event-meta-label">活動地點</div>
                <div class="event-meta-value" id="event-location"></div>
              </div>
              <div class="event-meta-item">
                <div class="event-meta-label">主辦單位</div>
                <div class="event-meta-value" id="event-organizer"></div>
              </div>
              <div class="event-meta-item">
                <div class="event-meta-label">報名概況</div>
                <div class="event-meta-value" id="event-slots"></div>
              </div>
            </div>
            <div class="event-meta-item" style="margin-top:12px;">
              <div class="event-meta-label">活動說明</div>
              <div class="event-meta-value" id="event-description"></div>
            </div>
          </div>

          <form id="register-form">
            <div class="section-block">
              <div class="section-title">基本資料</div>
              <div class="section-copy">姓名、學號與系級會優先帶入目前登入學生資料，你也可以在送出前調整。</div>
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label" for="attendee-name">姓名</label>
                  <input id="attendee-name" class="form-input" type="text" placeholder="請輸入姓名" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="attendee-phone">聯絡電話</label>
                  <input id="attendee-phone" class="form-input" type="tel" placeholder="09xx-xxx-xxx" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="student-id">學號</label>
                  <input id="student-id" class="form-input" type="text" placeholder="請輸入學號" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="class-info">系級</label>
                  <input id="class-info" class="form-input" type="text" placeholder="例如：資工四甲" required>
                </div>
              </div>
            </div>

            <div class="section-block">
              <div class="section-title">特殊欄位</div>
              <div class="section-copy">例如是否供餐、是否需要校外活動資料、身分證字號、緊急聯絡人等。這些欄位會依活動設定動態顯示。</div>
              <div id="custom-fields-container" class="form-grid"></div>
              <div id="custom-fields-empty" class="empty-custom-fields">此活動目前沒有額外要求的特殊欄位。</div>
            </div>

            <div class="section-block">
              <div class="section-title">補充說明</div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label" for="register-notes">備註</label>
                <textarea id="register-notes" class="form-textarea" placeholder="如有其他需求或補充資訊，可填寫於此。"></textarea>
              </div>
            </div>

            <div class="form-group">
              <label class="checkbox-row">
                <input type="checkbox" id="agree-terms" required>
                <span>我已確認活動資訊，並同意送出報名資料供活動主辦單位聯繫與活動執行使用。</span>
              </label>
            </div>
            <div class="actions" id="form-actions">
              <button type="button" class="btn btn-ghost" onclick="goBack()">返回活動列表</button>
              <button type="submit" class="btn btn-primary" id="submit-btn">確認報名</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/events-register.js"></script>
</body>
</html>
