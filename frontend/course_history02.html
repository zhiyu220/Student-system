<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course History — StuPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #fff;
    border-radius: 10px;
    padding: 18px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-value { font-size: 26px; font-weight: 700; color: var(--text); }
  .stat-unit  { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-bar label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
  .filter-bar select {
    padding: 7px 12px;
    border-radius: 6px;
    border: 1.5px solid #e0e0e0;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    cursor: pointer;
    outline: none;
  }
  .filter-bar select:focus { border-color: #4E6CF0; }

  .record-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .record-table th {
    background: #f5f7ff;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .4px;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1.5px solid #e8e8f0;
  }
  .record-table td {
    padding: 11px 14px;
    border-bottom: 1px solid #f0f0f5;
    vertical-align: middle;
  }
  .record-table tr:last-child td { border-bottom: none; }
  .record-table tr:hover td { background: #f9f9ff; }

  .badge-type {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge-required    { background: #EEF2FF; color: #4E6CF0; }
  .badge-elective    { background: #F0FDF4; color: #16a34a; }
  .badge-univ        { background: #FFF7ED; color: #ea580c; }
  .badge-general     { background: #FEF3C7; color: #d97706; }

  .grade-high  { color: #16a34a; font-weight: 700; }
  .grade-mid   { color: #d97706; font-weight: 700; }
  .grade-low   { color: #dc2626; font-weight: 700; }
  .grade-fail  { color: #9ca3af; font-weight: 700; }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
  }
  .page-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1.5px solid #e0e0e0;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .page-btn:hover:not(:disabled) { border-color: #4E6CF0; color: #4E6CF0; }
  .page-btn:disabled { opacity: .4; cursor: not-allowed; }
  .page-info { font-size: 13px; color: var(--text-muted); }
  .page-btn.active { background: #4E6CF0; color: #fff; border-color: #4E6CF0; }

  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .card-body { padding: 20px; }
</style>
</head>
<body>

<div class="layout">
<aside class="sidebar"></aside>
<div class="main">
  <header class="topbar">
    <button class="topbar-toggle" id="sidebar-toggle" aria-label="Toggle menu">☰</button>
    <div class="topbar-title"></div>
    <div class="api-status">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">Connecting...</span>
    </div>
  </header>

  <div class="content">
    <div class="page-header">
      <h2>Course History</h2>
      <p>Complete record of all enrolled courses and grades</p>
    </div>

    <!-- Summary stats -->
    <div class="summary-grid">
      <div class="stat-card">
        <div class="stat-label">Total Credits Earned</div>
        <div class="stat-value" id="stat-credits">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cumulative GPA</div>
        <div class="stat-value" id="stat-gpa">—<span class="stat-unit"> / 4.0</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Courses</div>
        <div class="stat-value" id="stat-courses">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Degree Completion</div>
        <div class="stat-value" id="stat-completion">—<span class="stat-unit">%</span></div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <label>Semester</label>
      <select id="semFilter" onchange="applyFilters()">
        <option value="all">All Semesters</option>
      </select>
      <label>Type</label>
      <select id="typeFilter" onchange="applyFilters()">
        <option value="all">All Types</option>
        <option value="required">Required</option>
        <option value="elective">Elective</option>
        <option value="university_required">University Required</option>
        <option value="general_education">General Education</option>
      </select>
    </div>

    <!-- Course table -->
    <div class="card">
      <div class="card-body" style="padding:0">
        <table class="record-table">
          <thead>
            <tr>
              <th>Semester</th>
              <th>Code</th>
              <th>Course Name</th>
              <th>Type</th>
              <th>Credits</th>
              <th>Grade</th>
              <th>GPA Points</th>
              <th>Instructor</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>
</div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
  const PAGE_SIZE = 10;
  let allRecords = [];
  let filtered   = [];
  let currentPage = 1;

  const TYPE_LABELS = {
    required:            'Required',
    elective:            'Elective',
    university_required: 'Univ. Required',
    general_education:   'Gen. Education',
  };
  const TYPE_BADGE = {
    required:            'badge-required',
    elective:            'badge-elective',
    university_required: 'badge-univ',
    general_education:   'badge-general',
  };

  function gradeClass(g) {
    if (g === null || g === undefined) return 'grade-fail';
    if (g >= 80) return 'grade-high';
    if (g >= 60) return 'grade-mid';
    return 'grade-low';
  }

  function initFilters(records) {
    const sems = [...new Set(records.map(r => `${r.academic_year}-${r.semester}`))].sort();
    const sel = document.getElementById('semFilter');
    sel.innerHTML = '<option value="all">All Semesters</option>';
    sems.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      sel.appendChild(opt);
    });
  }

  function applyFilters() {
    const sem  = document.getElementById('semFilter').value;
    const type = document.getElementById('typeFilter').value;
    filtered = allRecords.filter(r => {
      const semMatch  = sem  === 'all' || `${r.academic_year}-${r.semester}` === sem;
      const typeMatch = type === 'all' || r.type === type;
      return semMatch && typeMatch;
    });
    currentPage = 1;
    renderPage();
  }

  function renderPage() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const page  = filtered.slice(start, start + PAGE_SIZE);
    const tbody = document.getElementById('listBody');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text-muted)">No records found</td></tr>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    tbody.innerHTML = page.map(r => {
      const gradeDisp = r.grade !== null ? r.grade.toFixed(0) : '—';
      const typeBadge = TYPE_BADGE[r.type] || 'badge-elective';
      const typeLabel = TYPE_LABELS[r.type] || r.type;
      const statusBadge = r.status === 'completed'
        ? '<span class="badge badge-green">Completed</span>'
        : r.status === 'enrolled'
          ? '<span class="badge badge-blue">In Progress</span>'
          : `<span class="badge badge-amber">${r.status}</span>`;
      return `
        <tr>
          <td style="font-family:'DM Mono',monospace;font-size:13px">${r.academic_year}-${r.semester}</td>
          <td style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600">${r.code}</td>
          <td style="max-width:240px">${r.name_en}</td>
          <td><span class="badge-type ${typeBadge}">${typeLabel}</span></td>
          <td style="text-align:center">${r.credits}</td>
          <td style="text-align:center"><span class="${gradeClass(r.grade)}">${gradeDisp}</span></td>
          <td style="text-align:center">${r.gpa_points.toFixed(1)}</td>
          <td style="color:var(--text-muted);font-size:13px">${r.instructor || '—'}</td>
          <td>${statusBadge}</td>
        </tr>`;
    }).join('');

    renderPagination();
  }

  function renderPagination() {
    const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
    const pg = document.getElementById('pagination');
    if (totalPages <= 1) { pg.innerHTML = ''; return; }

    let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ Prev</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      } else if (Math.abs(i - currentPage) === 2) {
        html += `<span class="page-info">…</span>`;
      }
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next ›</button>`;
    html += `<span class="page-info">${filtered.length} records</span>`;
    pg.innerHTML = html;
  }

  function goPage(n) {
    const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
    if (n < 1 || n > totalPages) return;
    currentPage = n;
    renderPage();
  }

  (async () => {
    await checkAuth();
    initLayout('course-history', 'Course History');

    const user = getUser();
    const studentId = user?.student_id || '1111708';

    try {
      const data = await api.courseRecords(studentId);

      // Fill summary
      document.getElementById('stat-credits').textContent    = data.summary.total_credits;
      document.getElementById('stat-gpa').innerHTML          = `${data.summary.cumulative_gpa}<span class="stat-unit"> / 4.0</span>`;
      document.getElementById('stat-courses').textContent    = data.summary.total_courses;
      document.getElementById('stat-completion').innerHTML   = `${data.summary.degree_completion}<span class="stat-unit">%</span>`;

      allRecords = data.records;
      filtered   = allRecords;
      initFilters(allRecords);
      renderPage();

      document.getElementById('status-dot').className   = 'status-dot ok';
      document.getElementById('status-label').textContent = 'API Connected';
    } catch (err) {
      console.error('Failed to load course records:', err);
      document.getElementById('status-dot').className   = 'status-dot err';
      document.getElementById('status-label').textContent = 'API Error';
      document.getElementById('listBody').innerHTML =
        '<tr><td colspan="9" style="text-align:center;padding:32px;color:#dc2626">Failed to load data. Please try again.</td></tr>';
    }
  })();
</script>
</body>
</html>
