<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改密碼 — 校園智慧系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .notice {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      color: #92400e;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-input {
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--font);
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .password-strength {
      font-size: 12px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      background: var(--red);
      transition: width 0.3s, background-color 0.3s;
      width: 0%;
    }

    .strength-text {
      color: var(--text-muted);
      width: 60px;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper .form-input {
      flex: 1;
      padding-right: 40px;
    }

    .btn-show-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
      transition: opacity 0.15s;
      opacity: 0.6;
    }

    .btn-show-password:hover {
      opacity: 1;
    }

    .error-message {
      color: var(--red);
      font-size: 12px;
      margin-top: 8px;
      padding: 10px 12px;
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      color: #16a34a;
      font-size: 12px;
      margin-top: 8px;
      padding: 10px 12px;
      background: #dcfce7;
      border: 1px solid #86efac;
      border-radius: 6px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-submit {
      background: var(--accent);
      color: #fff;
    }

    .btn-submit:hover {
      background: #3d5ce6;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .btn-logout {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-logout:hover {
      background: var(--bg);
      color: var(--text);
    }

    .loading {
      display: none;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .user-info {
      background: var(--accent-light);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 12px;
    }

    .user-info-label {
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .user-info-value {
      font-weight: 600;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <div class="header">
        <div class="title">首次修改密碼</div>
        <div class="subtitle">系統要求您修改初始密碼</div>
      </div>

      <div class="notice">
        ⚠️ 為了帳號安全，首次登入必須修改密碼。<br>
        請設定一個強密碼（至少 6 個字符）。
      </div>

      <div class="user-info" id="user-info" style="display: none;">
        <div class="user-info-label">登入用戶</div>
        <div class="user-info-value" id="user-name">—</div>
      </div>

      <form id="change-pwd-form">
        <div class="form-group">
          <label class="form-label">新密碼</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password-input" 
              class="form-input" 
              placeholder="至少 6 個字符"
              required
            >
            <svg class="btn-show-password" id="toggle-password" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="cursor: pointer; width: 24px; height: 24px; position: absolute; right: 12px; opacity: 0.6; transition: opacity 0.15s;" title="顯示密碼">
              <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle class="eye-pupil" cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
          <div class="password-strength">
            <div class="strength-bar">
              <div class="strength-fill" id="strength-bar"></div>
            </div>
            <div class="strength-text" id="strength-text">弱</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">確認密碼</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="confirm-password-input" 
              class="form-input" 
              placeholder="••••••••"
              required
            >
            <svg class="btn-show-password" id="toggle-confirm-password" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="cursor: pointer; width: 24px; height: 24px; position: absolute; right: 12px; opacity: 0.6; transition: opacity 0.15s;" title="顯示密碼">
              <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle class="eye-pupil" cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
        </div>

        <div class="error-message" id="error-msg"></div>
        <div class="success-message" id="success-msg"></div>

        <div class="button-group">
          <button type="submit" class="btn btn-submit" id="submit-btn">確認修改</button>
          <button type="button" class="btn btn-logout" id="logout-btn">取消登出</button>
        </div>

        <div class="loading" id="loading">
          <span class="spinner"></span>處理中...
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // 檢查是否已登入且需要修改密碼
    setTimeout(() => {
      if (typeof auth === 'undefined' || !auth.user || !auth.mustChangePassword) {
        window.location.href = 'login.html';
        return;
      }

      // 顯示用戶信息
      document.getElementById('user-name').textContent = auth.user.name;
      document.getElementById('user-info').style.display = 'block';
    }, 100);

    // 顯示/隱藏密碼 - 新密碼
    document.getElementById('toggle-password').addEventListener('click', (e) => {
      e.preventDefault();
      const passwordInput = document.getElementById('password-input');
      const toggleBtn = document.getElementById('toggle-password');
      const eyePath = toggleBtn.querySelector('.eye-open');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyePath.style.display = 'none';
        // 顯示眼睛被劃掉的icon
        const closedEye = `<path class="eye-closed" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>`;
        toggleBtn.innerHTML = closedEye;
      } else {
        passwordInput.type = 'password';
        const openEye = `<path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle class="eye-pupil" cx="12" cy="12" r="3"></circle>`;
        toggleBtn.innerHTML = openEye;
      }
    });

    // 顯示/隱藏密碼 - 確認密碼
    document.getElementById('toggle-confirm-password').addEventListener('click', (e) => {
      e.preventDefault();
      const confirmPasswordInput = document.getElementById('confirm-password-input');
      const toggleBtn = document.getElementById('toggle-confirm-password');
      const eyePath = toggleBtn.querySelector('.eye-open');
      
      if (confirmPasswordInput.type === 'password') {
        confirmPasswordInput.type = 'text';
        eyePath.style.display = 'none';
        // 顯示眼睛被劃掉的icon
        const closedEye = `<path class="eye-closed" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>`;
        toggleBtn.innerHTML = closedEye;
      } else {
        confirmPasswordInput.type = 'password';
        const openEye = `<path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle class="eye-pupil" cx="12" cy="12" r="3"></circle>`;
        toggleBtn.innerHTML = openEye;
      }
    });

    // 密碼強度檢測
    const passwordInput = document.getElementById('password-input');
    const strengthBar = document.getElementById('strength-bar');
    const strengthText = document.getElementById('strength-text');

    passwordInput.addEventListener('input', () => {
      const pwd = passwordInput.value;
      let strength = 0;
      let text = '弱';

      if (pwd.length >= 6) strength += 25;
      if (pwd.length >= 10) strength += 25;
      if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) strength += 25;
      if (/[0-9]/.test(pwd)) strength += 15;
      if (/[!@#$%^&*]/.test(pwd)) strength += 10;

      strengthBar.style.width = strength + '%';

      if (strength < 25) {
        text = '弱';
        strengthBar.style.background = '#ef4444';
      } else if (strength < 50) {
        text = '普通';
        strengthBar.style.background = '#f59e0b';
      } else if (strength < 75) {
        text = '中等';
        strengthBar.style.background = '#3b82f6';
      } else {
        text = '強';
        strengthBar.style.background = '#22c55e';
      }

      strengthText.textContent = text;
    });

    // 表單提交
    document.getElementById('change-pwd-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = passwordInput.value;
      const confirmPassword = document.getElementById('confirm-password-input').value;
      const errorMsg = document.getElementById('error-msg');
      const successMsg = document.getElementById('success-msg');
      const loadingEl = document.getElementById('loading');
      const submitBtn = document.getElementById('submit-btn');

      // 清除消息
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');
      errorMsg.textContent = '';
      successMsg.textContent = '';

      // 驗證
      if (password.length < 6) {
        errorMsg.textContent = '密碼至少需要 6 個字符';
        errorMsg.classList.add('show');
        return;
      }

      if (password !== confirmPassword) {
        errorMsg.textContent = '兩次密碼輸入不一致';
        errorMsg.classList.add('show');
        return;
      }

      // 禁用按鈕並顯示載入狀態
      submitBtn.disabled = true;
      loadingEl.classList.add('show');

      try {
        await auth.changePassword(password, confirmPassword);

        // 修改成功
        successMsg.textContent = '密碼已成功修改，正在重定向...';
        successMsg.classList.add('show');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      } catch (error) {
        errorMsg.textContent = error.message || '密碼修改失敗，請稍後重試';
        errorMsg.classList.add('show');
        submitBtn.disabled = false;
        loadingEl.classList.remove('show');
      }
    });

    // 取消登出按鈕
    document.getElementById('logout-btn').addEventListener('click', () => {
      if (confirm('確定要取消登出嗎？')) {
        auth.logout();
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
