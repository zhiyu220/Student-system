<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>修改密碼 — StuPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Noto Sans TC', sans-serif;
        background: #F0F4FF;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 40px rgba(78, 108, 240, 0.12);
        width: 420px;
        max-width: 96vw;
        padding: 40px 36px;
      }
      .banner {
        background: #FEF3C7;
        border: 1px solid #FCD34D;
        border-radius: 8px;
        padding: 12px 16px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 28px;
        font-size: 13px;
        color: #92400E;
      }
      .banner i { font-size: 17px; flex-shrink: 0; margin-top: 1px; }
      h1 { font-size: 20px; font-weight: 700; color: #1A1D2E; margin-bottom: 6px; }
      .sub { font-size: 13px; color: #888898; margin-bottom: 28px; }

      .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
      .form-label { font-size: 12px; font-weight: 500; color: #555; }
      .input-wrap { position: relative; }
      .form-input {
        width: 100%;
        padding: 11px 40px 11px 14px;
        border: 1.5px solid #e8e8e4;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        color: #1A1D2E;
        background: #fff;
        outline: none;
        transition: border-color 0.15s;
      }
      .form-input:focus { border-color: #4E6CF0; }
      .form-input.error { border-color: #ef4444; }
      .pw-toggle {
        position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
        background: none; border: none; cursor: pointer; color: #888; font-size: 17px; padding: 0;
      }
      .pw-toggle:hover { color: #4E6CF0; }

      .hint { font-size: 11px; color: #aaa; margin-top: 3px; }

      .error-msg {
        display: none; background: #fee2e2; border: 1px solid #fca5a5;
        color: #991b1b; border-radius: 8px; padding: 10px 14px;
        font-size: 13px; margin-bottom: 14px;
      }
      .error-msg.show { display: block; }
      .success-msg {
        display: none; background: #dcfce7; border: 1px solid #86efac;
        color: #166534; border-radius: 8px; padding: 10px 14px;
        font-size: 13px; margin-bottom: 14px;
      }
      .success-msg.show { display: block; }

      .btn {
        width: 100%; padding: 12px; background: #4E6CF0; color: #fff;
        border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
        font-family: inherit; cursor: pointer; transition: background 0.15s; margin-top: 4px;
      }
      .btn:hover:not(:disabled) { background: #3d5ce6; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="banner">
        <i class="ti ti-alert-triangle"></i>
        <span>首次登入請修改密碼，修改後將跳轉至主頁面。</span>
      </div>

      <h1>修改密碼</h1>
      <p class="sub">請設定一組新密碼以繼續使用系統</p>

      <div id="error-msg"   class="error-msg"></div>
      <div id="success-msg" class="success-msg"></div>

      <form id="pw-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="old_password">舊密碼</label>
          <div class="input-wrap">
            <input class="form-input" id="old_password" type="password" placeholder="輸入目前密碼" autocomplete="current-password" />
            <button type="button" class="pw-toggle" data-target="old_password"><i class="ti ti-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="new_password">新密碼</label>
          <div class="input-wrap">
            <input class="form-input" id="new_password" type="password" placeholder="至少 8 個字元" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-target="new_password"><i class="ti ti-eye"></i></button>
          </div>
          <span class="hint">建議使用英文大小寫 + 數字組合</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password">確認新密碼</label>
          <div class="input-wrap">
            <input class="form-input" id="confirm_password" type="password" placeholder="再輸入一次新密碼" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-target="confirm_password"><i class="ti ti-eye"></i></button>
          </div>
        </div>
        <button class="btn" type="submit" id="btn-submit">確認修改</button>
      </form>
    </div>

    <script src="js/api.js"></script>
    <script>
      // 沒有 token 就回登入頁
      if (!getToken()) window.location.href = 'login.html';

      // 顯示/隱藏密碼切換
      document.querySelectorAll('.pw-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById(btn.dataset.target);
          const icon  = btn.querySelector('i');
          const show  = input.type === 'password';
          input.type  = show ? 'text' : 'password';
          icon.className = show ? 'ti ti-eye-off' : 'ti ti-eye';
        });
      });

      function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg; el.classList.add('show');
        document.getElementById('success-msg').classList.remove('show');
      }
      function showSuccess(msg) {
        const el = document.getElementById('success-msg');
        el.textContent = msg; el.classList.add('show');
        document.getElementById('error-msg').classList.remove('show');
      }

      document.getElementById('pw-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const old_pw  = document.getElementById('old_password').value;
        const new_pw  = document.getElementById('new_password').value;
        const conf_pw = document.getElementById('confirm_password').value;
        const btn     = document.getElementById('btn-submit');

        if (!old_pw || !new_pw || !conf_pw) { showError('請填寫所有欄位'); return; }
        if (new_pw.length < 8)              { showError('新密碼至少需要 8 個字元'); return; }
        if (new_pw !== conf_pw)             { showError('兩次輸入的新密碼不一致'); return; }

        btn.disabled = true; btn.textContent = '更新中…';

        try {
          await api.changePassword(old_pw, new_pw);
          showSuccess('密碼更新成功！即將跳轉…');
          // 更新本地 user 快取的 must_change_password
          const u = getUser();
          if (u) { u.must_change_password = false; saveUser(u); }
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
        } catch (err) {
          const status = err.message.match(/\d+/)?.[0];
          if (status === '400') showError('舊密碼不正確，請重新輸入');
          else if (status === '401') { clearToken(); clearUser(); window.location.href = 'login.html'; }
          else showError('更新失敗，請稍後再試');

          btn.disabled = false; btn.textContent = '確認修改';
        }
      });
    </script>
  </body>
</html>
